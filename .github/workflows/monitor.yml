# Va messo nel repository come:  .github/workflows/monitor.yml
name: Monitor posti carnet

on:
  schedule:
    - cron: "2-59/5 * * * *"   # ogni 5 minuti (GitHub puo' ritardare di qualche minuto)
  workflow_dispatch:            # pulsante "Run workflow" per lanciarlo a mano

concurrency:
  group: monitor-carnet
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  controlla:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install requests tzdata pyyaml

      - name: Recupera lo stato del giro precedente
        uses: actions/cache/restore@v6
        with:
          path: stato.json
          key: stato-${{ github.run_id }}
          restore-keys: stato-

      - name: Controlla i treni
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Modalita' carnet: se ci sono tutti e tre, controlla i posti prenotabili col carnet
          CARNET_NUMERO: ${{ secrets.CARNET_NUMERO }}
          CARNET_NOME: ${{ secrets.CARNET_NOME }}
          CARNET_COGNOME: ${{ secrets.CARNET_COGNOME }}
          ESCLUDI: ${{ vars.ESCLUDI }}
          GIORNI_SPECIALI: ${{ vars.GIORNI_SPECIALI }}
          SOLO_GIORNI: ${{ vars.SOLO_GIORNI }}
          GIORNI_AVANTI: ${{ vars.GIORNI_AVANTI }}
        run: python monitor_carnet.py --una-volta

      - name: Salva lo stato per il giro successivo
        if: always()
        uses: actions/cache/save@v6
        with:
          path: stato.json
          key: stato-${{ github.run_id }}
